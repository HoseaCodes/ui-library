# Serves public/ on GitHub Pages, so registry items are available at
#   https://<pages host>/r/{name}.json
# (uiheat.com once the custom domain is set up in Settings → Pages).
#
# public/r/ is committed build output (npm run check), so there's no build step.
# The raw.githubusercontent.com URL keeps working alongside this.
#
# One-time setup: Settings → Pages → Source: "GitHub Actions".

name: Deploy registry

on:
  push:
    branches: [master]
    paths: ["public/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
